# Release (ADR 0012, point 5; RELEASING.md): a vX.Y.Z tag builds the archive
# with make ci, then publishes it with its SHA-256 and the notes taken from
# CHANGELOG.md. Run by hand, it is a dry run: same build, nothing published.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs the code of the repository and of its dependencies, with a read-only
  # token. No cache: a release is built from scratch.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, to check that the commit belongs to main.
          fetch-depth: 0
          persist-credentials: false

      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          RUN: ${{ github.run_number }}
        run: |
          if [ "$EVENT" = push ]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"
              exit 1
            fi
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=essai-$RUN" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that the commit belongs to main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::commit $GITHUB_SHA is not on main"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Release notes from CHANGELOG.md
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          go run ./internal/tools/relnotes "$VERSION" > dist/notes.md

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: make tools
        run: make tools

      - name: make ci
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make ci VERSION="$VERSION"

      - name: Check the archive
        working-directory: dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sha256sum -c "tribe-menus-$VERSION-linux-amd64.tar.gz.sha256"

      - name: Keep the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            dist/tribe-menus-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
            dist/tribe-menus-${{ steps.version.outputs.version }}-linux-amd64.tar.gz.sha256
            dist/notes.md
          retention-days: 7
          if-no-files-found: error

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The only job allowed to write: it runs no code from the repository or its
  # dependencies, only the files built above, sha256sum and gh.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Check the archive
        working-directory: dist
        run: sha256sum -c "tribe-menus-$GITHUB_REF_NAME-linux-amd64.tar.gz.sha256"

      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "tribe-menus-$GITHUB_REF_NAME-linux-amd64.tar.gz" \
            "tribe-menus-$GITHUB_REF_NAME-linux-amd64.tar.gz.sha256"
