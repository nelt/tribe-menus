# Monthly version updates, one grouped pull request per ecosystem (ADR 0004,
# docs/securite-depot.md). Security updates do not wait for this schedule.
# Not covered, to follow by hand: CLAUDE_CODE_VERSION and GH_VERSION in the Dockerfile,
# .nvmrc and the VS Code extensions pinned in devcontainer.json.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    # Only the tools and the application's direct dependencies. The tools'
    # own dependencies follow the versions each tool requires: bumped one by
    # one, they can break a tool (yaml/v4 rc.6 broke actionlint 1.7.12).
    # allow also applies to security updates; Dependabot alerts still cover
    # every dependency, and govulncheck checks the application code.
    allow:
      - dependency-type: direct
      - dependency-name: github.com/rhysd/actionlint
      - dependency-name: github.com/sqlc-dev/sqlc
      - dependency-name: golang.org/x/vuln
      - dependency-name: honnef.co/go/tools
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    ignore:
      # @types/node follows the Node major version set in .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A new TypeScript major version is evaluated in a dedicated pull request.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: monthly
    ignore:
      # A new Go release goes with go.mod, in a deliberate pull request.
      - dependency-name: golang
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      devcontainer:
        patterns: ["*"]
