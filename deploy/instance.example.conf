# Values of the instance (plan recette, D4), copied to /etc/tribe-menus/instance.conf on
# the server and filled with the real values, which never go into the repository (ADR
# 0011, point 5). provision.sh reads this file as data, never as shell: one KEY=value per
# line, without quotes or spaces; lines starting with # are comments. Every key is
# required, an unknown key is refused. No secret here: they are entered with
# tribe-menus-credential (deploy/README.md).

# Personal administration account, the only one SSH admits (ADR 0015, point 3).
ADMIN_USER=alice

# Address of the administrator: alerts of the application and of the server, ACME
# contact.
ADMIN_EMAIL=admin@example.org

# Host names of the environments (ADR 0017).
PRODUCTION_HOST=meltingtribe.example.org
RECETTE_HOST=recette.meltingtribe.example.org

# SMTP server, TLS from the start (ADR 0014).
SMTP_HOST=smtp.example.org
SMTP_PORT=465

# Account of the application, which sends the login codes and its alerts.
APP_SMTP_USER=no-reply@example.org
APP_SMTP_FROM=no-reply@example.org

# Account of the server, which sends the update reports and the alerts it relays (ADR
# 0015, point 6).
SERVER_SMTP_USER=server@example.org
SERVER_SMTP_FROM=server@example.org
