<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Modifier un plat (liserés doux)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',sans-serif;color:#22193A;background:#FFFFFF}
a{color:#C63D24}a:hover{color:#9E2E19}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Figtree', sans-serif; color: #22193A">

<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 100px; overflow-y: auto">
<div style="display: flex; flex-direction: column; gap: 16px; padding: 20px 20px 16px">

<a href="Doux-Bibliotheque.dc.html" style="display: flex; align-items: center; gap: 4px; min-height: 44px; font-size: 15px; font-weight: 700; color: #22193A; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>Plats</a>

<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex-shrink: 0; width: 44px; height: 44px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid rgb(225, 195, 157); display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; color: #B36A0B">R</span>
<h1 style="margin: 0; min-width: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">Ratatouille</h1>
</div>

<sc-if value="{{conflict}}" hint-placeholder-val="{{false}}">
<div role="alert" style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 16px; border: 1.5px solid #F2D27A; color: #8A6100">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M10.3 3.9L2.4 17.6A2 2 0 0 0 4.1 20.6h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9.5v4.5"></path><circle cx="12" cy="17.2" r="0.6" fill="currentColor"></circle></svg>
<span style="font-size: 14px; font-weight: 700; line-height: 1.4">Ce plat a été modifié entre-temps. Voici sa version à jour : refaites votre modification.</span>
</div>
</sc-if>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Nom du plat
<input type="text" value="Ratatouille" maxlength="60" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 16px; border: 2px solid #22193A; background: #FFFFFF; font-size: 17px; font-weight: 700; color: #22193A">
</label>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; border-radius: 18px; border: 1.5px solid #F2D27A">
<span style="font-size: 15px; font-weight: 700">Pour combien de parts ?</span>
<div style="display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 14px; border: 1.5px solid #22193A">
<button aria-label="Une part de moins" style="width: 40px; height: 42px; border: none; border-radius: 11px; background: transparent; color: #22193A; font-size: 22px; font-weight: 700; cursor: pointer">−</button>
<span style="min-width: 24px; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">{{servings}}</span>
<button aria-label="Une part de plus" style="width: 40px; height: 42px; border: none; border-radius: 11px; background: transparent; color: #C63D24; font-size: 22px; font-weight: 800; cursor: pointer">+</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px">Ingrédients</h2>

<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 52px 88px minmax(0, 1fr) 36px; gap: 6px; align-items: center; padding: 5px; border-radius: 16px; border: 1.5px solid #E7E1EE">
<span style="{{r.qtyStyle}}">{{r.qty}}</span>
<span style="{{r.unitStyle}}">{{r.unit}}</span>
<span style="padding-left: 6px; font-weight: 700; font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{r.name}}</span>
<button aria-label="Retirer l’ingrédient" style="width: 36px; height: 40px; border: none; border-radius: 10px; background: transparent; color: #6E6680; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-for>

<button style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 48px; border: 2px dashed #CFC6DE; border-radius: 16px; background: transparent; font-size: 15px; font-weight: 700; color: #22193A; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Ajouter un ingrédient</button>
</div>

</div>
</div>

<div style="position: absolute; left: 20px; right: 20px; bottom: 24px">
<sc-if value="{{editing}}" hint-placeholder-val="{{true}}">
<button onClick="{{save}}" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; box-sizing: border-box; border: none; border-radius: 18px; background: #C63D24; color: #FFFFFF; font-size: 17px; font-weight: 800; cursor: pointer">Enregistrer le plat</button>
</sc-if>
<sc-if value="{{conflict}}" hint-placeholder-val="{{false}}">
<a href="Doux-Bibliotheque.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; box-sizing: border-box; border-radius: 18px; background: #C63D24; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 800">Enregistrer le plat</a>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844},"etat":{"editor":"enum","options":["modification","modifié entre-temps"],"default":"modification"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { refused: false };
  }
  renderVals() {
    var self = this;
    var cell = 'height: 38px; box-sizing: border-box; border-radius: 10px; display: flex; align-items: center; justify-content: center; ';
    var row = function (qty, unit, name) {
      var has = qty !== '';
      return {
        qty: has ? qty : 'Qté',
        unit: has ? unit : '',
        name: name,
        qtyStyle: cell + 'border: 1.5px solid #E7E1EE; ' + (has ? 'font-weight: 800; color: #22193A' : 'font-size: 14px; font-weight: 600; color: #6E6680'),
        unitStyle: cell + (has ? 'border: 1.5px solid #E7E1EE; font-size: 14px; font-weight: 600; color: #22193A; white-space: nowrap' : 'border: 1.5px dashed #CFC6DE')
      };
    };
    // Version d’Alice, ouverte avant que Bruno n’enregistre la sienne.
    var mine = {
      servings: 4,
      rows: [
        row('3', 'pièces', 'courgette'),
        row('2', 'pièces', 'aubergine'),
        row('4', 'pièces', 'tomate'),
        row('2', 'c. à soupe', 'huile d’olive'),
        row('', '', 'sel')
      ]
    };
    // Version à jour, enregistrée par Bruno entre-temps, renvoyée avec le refus.
    var current = {
      servings: 6,
      rows: [
        row('4', 'pièces', 'courgette'),
        row('2', 'pièces', 'aubergine'),
        row('4', 'pièces', 'tomate'),
        row('2', 'pièces', 'ail'),
        row('3', 'c. à soupe', 'huile d’olive'),
        row('', '', 'sel')
      ]
    };
    var conflict = this.state.refused || (this.props.etat ?? 'modification') === 'modifié entre-temps';
    var dish = conflict ? current : mine;
    return {
      conflict: conflict,
      editing: !conflict,
      servings: dish.servings,
      rows: dish.rows,
      save: function () { self.setState({ refused: true }); }
    };
  }
}
</script>
</body>
</html>
