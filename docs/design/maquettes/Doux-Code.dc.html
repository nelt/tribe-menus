<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil : saisie du code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',sans-serif;color:#22193A;background:#FFFFFF}
a{color:#C63D24}a:hover{color:#9E2E19}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Figtree', sans-serif; color: #22193A">

<div style="position: absolute; inset: 0">
<dc-import name="FondTribu" graine="{{graine}}" hint-size="390px,844px"></dc-import>
</div>

<div style="position: absolute; left: 20px; right: 20px; top: 120px; display: flex; flex-direction: column; align-items: center">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 26px 20px; border-radius: 28px; background: #FFFFFF; border: 2px solid #22193A">
<span style="display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; border: 1.5px solid #F2D27A; font-size: 13px; font-weight: 700; color: #8A6100"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20a6 6 0 0 1 12 0"></path><circle cx="17" cy="9" r="2.6"></circle><path d="M16 14.2a5 5 0 0 1 5.5 5.8"></path></svg>Les Martin</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 52px; letter-spacing: -1px; line-height: 1">Menus</h1>
<span style="font-size: 15px; font-weight: 700; color: #C63D24">de la tribu</span>
</div>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; flex-direction: column; gap: 14px; padding: 22px 18px 18px; border-radius: 28px; background: #FFFFFF; border: 2px solid #22193A">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">Vérifiez vos e-mails</h2>
<span style="font-size: 14px; font-weight: 600; line-height: 1.4; color: #5E5470">Si <strong style="color: #22193A">alice@exemple.fr</strong> fait partie de la tribu, un code à 6 chiffres vient d’y être envoyé. <a href="Doux-Connexion.dc.html" style="font-weight: 800">Modifier</a></span>
</div>

<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Code de connexion</legend>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{digits}}" as="d" hint-placeholder-count="6">
<input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" value="{{d.value}}" aria-label="{{d.label}}" style="{{d.style}}">
</sc-for>
</div>
<sc-if value="{{hasError}}" hint-placeholder-val="{{false}}">
<span role="alert" style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #C63D24"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg>{{errorText}}</span>
</sc-if>
</fieldset>

<sc-if value="{{canSubmit}}" hint-placeholder-val="{{true}}">
<a href="Doux-Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; box-sizing: border-box; border-radius: 18px; background: #C63D24; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 800">Se connecter</a>
</sc-if>
<sc-if value="{{mustResend}}" hint-placeholder-val="{{false}}">
<button style="height: 56px; border: none; border-radius: 18px; background: #C63D24; color: #FFFFFF; font-size: 17px; font-weight: 800; cursor: pointer">Recevoir un nouveau code</button>
</sc-if>
<sc-if value="{{canSubmit}}" hint-placeholder-val="{{true}}">
<button style="min-height: 44px; border: none; background: transparent; color: #22193A; font-size: 14px; font-weight: 700; cursor: pointer">Je n’ai rien reçu : renvoyer un code</button>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844},"etat":{"editor":"enum","options":["saisie","code erroné","code expiré"],"default":"saisie"},"graine":{"editor":"int","default":7,"min":1,"max":999}}'>
class Component extends DCLogic {
  renderVals() {
    var etat = this.props.etat ?? 'saisie';
    var wrong = etat === 'code erroné';
    var expired = etat === 'code expiré';
    var values = etat === 'saisie' ? ['4', '8', '2', '1', '', ''] : ['4', '8', '2', '1', '9', '0'];
    var focus = etat === 'saisie' ? 4 : -1;
    var digits = values.map(function (v, i) {
      var border = wrong ? '2px solid #C63D24' : (i === focus ? '2px solid #E39A89' : (v ? '2px solid #22193A' : '1.5px solid #E7E1EE'));
      return {
        value: v,
        label: 'Chiffre ' + (i + 1) + ' sur 6',
        style: 'width: 100%; height: 56px; box-sizing: border-box; padding: 0; border-radius: 14px; border: ' + border + "; background: #FFFFFF; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; color: " + (expired ? '#6E6680' : '#22193A')
      };
    });
    return {
      digits: digits,
      hasError: wrong || expired,
      errorText: wrong ? 'Code incorrect. Il vous reste 2 essais.' : 'Ce code a expiré.',
      canSubmit: !expired,
      mustResend: expired,
      graine: this.props.graine ?? 7
    };
  }
}
</script>
</body>
</html>
