<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ajouter un article à la main</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',sans-serif;color:#22193A;background:#FFFFFF}
a{color:#C63D24}a:hover{color:#9E2E19}
button,input,select{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Figtree', sans-serif; color: #22193A">

<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 84px; overflow-y: auto">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 20px 28px">

<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.5px"><a href="Doux-ChoixListes.dc.html" aria-label="Courses, liste principale. Changer de liste" style="display: flex; align-items: center; gap: 8px; min-height: 48px; color: #22193A; text-decoration: none"><span>Courses</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg><span style="padding: 3px 10px; border-radius: 999px; border: 1.5px solid #22193A; font-family: 'Figtree', sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 0">principale</span></a></h1>

<sc-if value="{{hasError}}" hint-placeholder-val="{{false}}">
<div role="alert" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 16px; border: 1.5px solid #E39A89; color: #9E2E19">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>
<span style="font-size: 14px; font-weight: 700; line-height: 1.35">Réseau nécessaire. Le réseau est lent ou absent : réessayez.</span>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 6px 0 14px; box-sizing: border-box; border-radius: 16px; border: 1.5px solid #E7E1EE">
<input type="checkbox" aria-label="{{it.checkLabel}}" style="width: 24px; height: 24px; margin: 0; flex-shrink: 0; accent-color: #2F7A3E">
<span style="flex-grow: 1; min-width: 0; font-size: 16px; font-weight: 700">{{it.name}}</span>
<sc-if value="{{it.isManual}}" hint-placeholder-val="{{true}}"><span style="flex-shrink: 0; padding: 2px 8px; border-radius: 999px; border: 1.5px dashed #CFC6DE; font-size: 12px; font-weight: 700; color: #5E5470">ajouté</span></sc-if>
<sc-if value="{{it.isComputed}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; padding: 2px 8px; border-radius: 999px; border: 1.5px solid #E7E1EE; font-size: 12px; font-weight: 700; color: #5E5470">{{it.dishes}}</span></sc-if>
<span style="flex-shrink: 0; font-size: 15px; font-weight: 800; color: #C63D24">{{it.qty}}</span>
<span style="width: 40px; flex-shrink: 0"></span>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 16px; border: 1.5px solid #E39A89">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #5E5470">Article
<input type="text" role="combobox" aria-expanded="{{hasSuggestions}}" aria-autocomplete="list" value="{{draftName}}" onChange="{{typeName}}" placeholder="ex. pain, lessive" maxlength="40" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: {{nameBorder}}; font-size: 16px; font-weight: 700; color: #22193A"></label>
<sc-if value="{{hasNameError}}" hint-placeholder-val="{{false}}">
<div role="alert" style="display: flex; align-items: center; gap: 8px; color: #9E2E19; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>{{nameError}}</div>
</sc-if>
<sc-if value="{{hasSuggestions}}" hint-placeholder-val="{{true}}">
<div role="listbox" aria-label="Propositions d’ingrédients" style="display: flex; flex-direction: column; border-radius: 12px; border: 1.5px solid #F3C9BF; overflow: hidden">
<sc-for list="{{suggestions}}" as="g" hint-placeholder-count="3">
<button role="option" onClick="{{g.pick}}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border: none; border-bottom: 1.5px solid #F0EAF4; background: #FFFFFF; text-align: left; font-size: 15px; color: #22193A; cursor: pointer"><span><strong style="color: #C63D24">{{g.head}}</strong>{{g.tail}}</span><span style="margin-left: auto; font-size: 12px; font-weight: 600; color: #5E5470">{{g.unit}}</span></button>
</sc-for>
<sc-if value="{{canCreate}}" hint-placeholder-val="{{true}}">
<button role="option" onClick="{{create}}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border: none; background: #FFFFFF; text-align: left; font-size: 15px; font-weight: 700; color: #C63D24; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>{{createLabel}}</button>
</sc-if>
</div>
</sc-if>
<div style="display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 6px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #5E5470">Quantité
<input type="text" inputmode="decimal" value="{{draftQty}}" onChange="{{typeQty}}" placeholder="Qté" maxlength="10" style="{{qtyStyle}}"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #5E5470">Unité
<select disabled="{{unitDisabled}}" value="{{draftUnit}}" onChange="{{pickUnit}}" style="{{unitStyle}}">
<option value="">{{unitPlaceholder}}</option>
<option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="cl">cl</option><option value="l">l</option><option value="piece">pièce</option><option value="tablespoon">c. à soupe</option><option value="teaspoon">c. à café</option><option value="pinch">pincée</option>
</select></label>
</div>
<p style="margin: 0; font-size: 12px; font-weight: 600; line-height: 1.4; color: #5E5470">{{help}}</p>
<sc-if value="{{hasQtyError}}" hint-placeholder-val="{{false}}">
<div role="alert" style="display: flex; align-items: center; gap: 8px; color: #9E2E19; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>{{qtyError}}</div>
</sc-if>
<div style="display: flex; gap: 8px">
<button onClick="{{confirm}}" style="flex-grow: 1; height: 46px; border: none; border-radius: 14px; background: #C63D24; color: #FFFFFF; font-size: 15px; font-weight: 800; cursor: pointer">Ajouter à la liste</button>
<a href="Doux-Liste.dc.html" style="height: 46px; padding: 0 14px; display: flex; align-items: center; border-radius: 14px; color: #22193A; text-decoration: none; font-size: 15px; font-weight: 700">Annuler</a>
</div>
</div>

</div>
</div>

<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 10px 16px 18px; background: #FFFFFF; border-top: 1.5px solid #E7E1EE; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<a href="Doux-Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; color: #5E5470; text-decoration: none; font-size: 12px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>Planning</a>
<a href="Doux-Bibliotheque.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; color: #5E5470; text-decoration: none; font-size: 12px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5"></path><path d="M9 8h6"></path></svg>Plats</a>
<a href="Doux-Liste.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; background: #C63D24; color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 800"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"></path><circle cx="10" cy="20" r="1.3"></circle><circle cx="17" cy="20" r="1.3"></circle></svg>Courses</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844},"etat":{"editor":"enum","options":["propositions","ingrédient nouveau","ingrédient choisi, sans quantité","quantité et unité","nom vide","quantité invalide","unité à choisir","quantité trop précise","réseau nécessaire"],"default":"propositions"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { etat: null, draftName: '', draftQty: '', draftUnit: '', picked: null, nameError: '', qtyError: '', error: false, added: [] };
  }
  norm(s) {
    return s.toLowerCase().replace(/œ/g, 'oe').replace(/æ/g, 'ae').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’]/g, "'").replace(/\s+/g, ' ').trim();
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var etat = this.props.etat || 'propositions';
    var PRESET = {
      'propositions': { draftName: 'p', picked: null },
      'ingrédient nouveau': { draftName: 'papier cuisson', picked: null },
      'ingrédient choisi, sans quantité': { draftName: 'lait', picked: ['lait', 'l'] },
      'quantité et unité': { draftName: 'pain', picked: ['pain', 'pièce'], draftQty: '2', draftUnit: 'piece' },
      'nom vide': { draftName: '', nameError: 'Indiquez un article.' },
      'quantité invalide': { draftName: 'pain', picked: ['pain', 'pièce'], draftQty: '0', draftUnit: 'piece', qtyError: 'Quantité invalide.' },
      'unité à choisir': { draftName: 'papier cuisson', picked: ['papier cuisson', ''], draftQty: '1', qtyError: 'Choisissez une unité.' },
      'quantité trop précise': { draftName: 'lait', picked: ['lait', 'l'], draftQty: '2,5', draftUnit: 'ml', qtyError: 'Quantité trop précise pour cette unité.' },
      'réseau nécessaire': { draftName: 'pain', picked: ['pain', 'pièce'], draftQty: '2', draftUnit: 'piece', error: true }
    };
    if (st.etat !== etat) {
      setTimeout(function () { self.setState(Object.assign({ etat: etat, draftName: '', draftQty: '', draftUnit: '', picked: null, nameError: '', qtyError: '', error: false, added: [] }, PRESET[etat] || {})); }, 0);
    }
    var REF = [['pain', 'pièce'], ['pain de mie', 'pièce'], ['pâtes', 'g'], ['piment d’Espelette', 'pincée'], ['poivre', ''], ['pomme de terre', 'kg'], ['lessive', ''], ['lait', 'l'], ['sel', ''], ['oignon', 'pièce']];
    var UNITS = { g: 'g', kg: 'kg', ml: 'ml', cl: 'cl', l: 'l', piece: 'pièce', tablespoon: 'c. à soupe', teaspoon: 'c. à café', pinch: 'pincée' };
    var codeOf = function (label) { for (var k in UNITS) { if (UNITS[k] === label) { return k; } } return ''; };
    var typed = st.draftName || '';
    var nt = self.norm(typed);
    var sugg = [];
    if (nt && st.picked === null) {
      REF.forEach(function (r) {
        var hit = self.norm(r[0]).split(' ').some(function (w) { return w.indexOf(nt) === 0; });
        if (hit && sugg.length < 6) { sugg.push(r); }
      });
      sugg.sort(function (a, b) { return self.norm(a[0]) < self.norm(b[0]) ? -1 : 1; });
    }
    var exact = REF.some(function (r) { return self.norm(r[0]) === nt; });
    var defaultUnit = st.picked ? st.picked[1] : '';
    var hasQty = (st.draftQty || '').trim().length > 0;
    var offline = etat === 'réseau nécessaire';
    var base = [
      { name: 'bœuf haché', qty: '875 g', dishes: '2 plats', isComputed: true, isManual: false },
      { name: 'oignon', qty: '2 pièces', dishes: '2 plats', isComputed: true, isManual: false },
      { name: 'pain', qty: '2 pièces', isManual: true, isComputed: false }
    ].concat(st.added);
    return {
      hasError: st.error,
      items: base.map(function (x) { return Object.assign({ checkLabel: 'Cocher ' + x.name }, x); }),
      draftName: st.draftName,
      nameBorder: st.nameError ? '2px solid #C63D24' : '2px solid #22193A',
      typeName: function (e) { self.setState({ draftName: e.target.value, picked: null, nameError: '' }); },
      hasNameError: !!st.nameError,
      nameError: st.nameError,
      hasSuggestions: !!nt && st.picked === null,
      suggestions: sugg.map(function (r) {
        var n = typed.trim().length;
        return { head: r[0].slice(0, n), tail: r[0].slice(n), unit: r[1], pick: function () { self.setState({ draftName: r[0], picked: r, draftUnit: self.state.draftQty ? codeOf(r[1]) : '' }); } };
      }),
      canCreate: !!nt && !exact,
      createLabel: 'Créer « ' + typed.trim().replace(/\s+/g, ' ') + ' »',
      create: function () { self.setState({ draftName: typed.trim().replace(/\s+/g, ' '), picked: [typed.trim(), ''] }); },
      draftQty: st.draftQty,
      typeQty: function (e) {
        var v = e.target.value;
        var u = self.state.draftUnit || (v.trim() ? codeOf(defaultUnit) : '');
        self.setState({ draftQty: v, draftUnit: v.trim() ? u : '', qtyError: '' });
      },
      qtyStyle: 'height: 44px; box-sizing: border-box; padding: 0 10px; border-radius: 12px; font-size: 15px; font-weight: 700; color: #22193A; border: ' + (st.qtyError && st.qtyError !== 'Choisissez une unité.' ? '2px solid #C63D24' : '1.5px solid #E7E1EE'),
      unitDisabled: !hasQty,
      draftUnit: st.draftUnit,
      pickUnit: function (e) { self.setState({ draftUnit: e.target.value, qtyError: '' }); },
      unitPlaceholder: hasQty ? 'Choisir' : (defaultUnit || '—'),
      unitStyle: 'height: 44px; box-sizing: border-box; padding: 0 8px; border-radius: 12px; background: #FFFFFF; font-size: 15px; font-weight: 700; color: ' + (hasQty ? '#22193A' : '#6E6680') + '; border: ' + (st.qtyError === 'Choisissez une unité.' ? '2px solid #C63D24' : '1.5px solid #E7E1EE'),
      help: st.picked && !hasQty ? (defaultUnit ? 'Sans quantité, l’article s’affiche seul. Une quantité prend l’unité « ' + defaultUnit + ' ».' : 'Sans quantité, l’article s’affiche seul.') : 'Quantité facultative.',
      hasQtyError: !!st.qtyError,
      qtyError: st.qtyError,
      confirm: function () {
        if (offline) { self.setState({ error: true }); return; }
        var name = (self.state.draftName || '').trim().replace(/\s+/g, ' ');
        if (!name) { self.setState({ nameError: 'Indiquez un article.' }); return; }
        var q = (self.state.draftQty || '').trim();
        var label = '';
        if (q) {
          var num = Number(q.replace(',', '.'));
          if (!(num > 0)) { self.setState({ qtyError: 'Quantité invalide.' }); return; }
          if (!self.state.draftUnit) { self.setState({ qtyError: 'Choisissez une unité.' }); return; }
          var dec = (q.replace(',', '.').split('.')[1] || '').length;
          var max = self.state.draftUnit === 'ml' ? 0 : (self.state.draftUnit === 'cl' ? 1 : 3);
          if (dec > max) { self.setState({ qtyError: 'Quantité trop précise pour cette unité.' }); return; }
          var ul = UNITS[self.state.draftUnit];
          label = q.replace('.', ',') + ' ' + ((num >= 2 && (ul === 'pièce' || ul === 'pincée')) ? ul + 's' : ul);
        }
        self.setState({ added: self.state.added.concat([{ name: name, qty: label, isManual: true, isComputed: false }]), draftName: '', draftQty: '', draftUnit: '', picked: null, nameError: '', qtyError: '', error: false });
      }
    };
  }
}
</script>
</body>
</html>
