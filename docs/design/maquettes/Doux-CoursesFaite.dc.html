<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Liste de courses faite</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',sans-serif;color:#22193A;background:#FFFFFF}
a{color:#C63D24}a:hover{color:#9E2E19}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Figtree', sans-serif; color: #22193A">

<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 84px; overflow-y: auto">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 28px">

<a href="Doux-Historique.dc.html" style="display: flex; align-items: center; gap: 4px; min-height: 44px; font-size: 15px; font-weight: 700; color: #22193A; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>Historique</a>

<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.5px">29 sept. → 5 oct.</h1>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; border: 1.5px solid #A9D3B1; font-size: 13px; font-weight: 800; color: #2F7A3E"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Faite le sam. 3 oct.</span>
<span style="display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; border: 1.5px dashed #CFC6DE; font-size: 13px; font-weight: 700; color: #5E5470"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Lecture seule</span>
</div>

<div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 700"><span>12 sur 14 articles pris</span><span style="color: #5E5470">2 non cochés</span></div>

<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="14">
<div style="{{it.rowStyle}}">
<input type="checkbox" disabled="{{true}}" checked="{{it.checked}}" aria-label="{{it.name}}" style="width: 24px; height: 24px; margin: 0; flex-shrink: 0; accent-color: #2F7A3E">
<span style="{{it.nameStyle}}">{{it.name}}</span>
<sc-if value="{{it.added}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; padding: 2px 8px; border-radius: 999px; border: 1.5px dashed #CFC6DE; font-size: 12px; font-weight: 700; color: #5E5470">ajouté</span></sc-if>
<span style="{{it.qtyStyle}}">{{it.qty}}</span>
</div>
</sc-for>
</div>

</div>
</div>

<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 10px 16px 18px; background: #FFFFFF; border-top: 1.5px solid #E7E1EE; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<a href="Doux-Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; color: #5E5470; text-decoration: none; font-size: 12px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>Planning</a>
<a href="Doux-Bibliotheque.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; color: #5E5470; text-decoration: none; font-size: 12px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5"></path><path d="M9 8h6"></path></svg>Plats</a>
<a href="Doux-ListesCourses.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; background: #C63D24; color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 800"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"></path><circle cx="10" cy="20" r="1.3"></circle><circle cx="17" cy="20" r="1.3"></circle></svg>Courses</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [
      { name: 'Poivron', qty: '2 pièces', checked: false },
      { name: 'Citron', qty: '1 pièce', checked: false },
      { name: 'Poulet', qty: '1,2 kg', checked: true },
      { name: 'Riz', qty: '500 g', checked: true },
      { name: 'Tomate', qty: '6 pièces', checked: true },
      { name: 'Oignon', qty: '3 pièces', checked: true },
      { name: 'Courgette', qty: '4 pièces', checked: true },
      { name: 'Lait de coco', qty: '40 cl', checked: true },
      { name: 'Farine', qty: '500 g', checked: true },
      { name: 'Œufs', qty: '6 pièces', checked: true },
      { name: 'Beurre', qty: '250 g', checked: true },
      { name: 'Comté', qty: '200 g', checked: true },
      { name: 'Pain', qty: '2 pièces', checked: true, added: true },
      { name: 'Éponges', qty: '', checked: true, added: true }
    ];
    return {
      items: list.map(function (x) {
        var on = x.checked;
        return {
          name: x.name,
          qty: x.qty,
          checked: on,
          added: !!x.added,
          rowStyle: 'display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 14px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid ' + (on ? '#A9D3B1' : '#E7E1EE'),
          nameStyle: 'flex-grow: 1; font-size: 16px; font-weight: 700; ' + (on ? 'text-decoration: line-through; color: #5E5470' : 'color: #22193A'),
          qtyStyle: 'font-size: 15px; font-weight: 800; color: #5E5470'
        };
      })
    };
  }
}
</script>
</body>
</html>
