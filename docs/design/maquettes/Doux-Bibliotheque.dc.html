<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bibliothèque de plats (liserés doux)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',sans-serif;color:#22193A;background:#FFFFFF}
a{color:#C63D24}a:hover{color:#9E2E19}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Figtree', sans-serif; color: #22193A">

<div style="display: flex; flex-direction: column; gap: 14px; padding: 24px 20px 100px">

<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; letter-spacing: -0.5px">Plats</h1>
<a href="Doux-Plat.dc.html" style="display: flex; align-items: center; gap: 6px; height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; background: #C63D24; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 800"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Nouveau</a>
</div>

<label style="display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 14px; border-radius: 18px; border: 2px solid #22193A">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E5470" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rechercher un plat ou un ingrédient</span>
<input type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Nom du plat ou ingrédient" style="flex-grow: 1; border: none; outline: none; background: transparent; font-family: inherit; font-size: 16px; color: #22193A">
</label>

<span style="font-size: 14px; font-weight: 600; color: #5E5470">{{countLabel}}</span>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{results}}" as="p" hint-placeholder-count="3">
<div style="display: flex; gap: 12px; padding: 12px; border-radius: 20px; border: 1.5px solid #E7E1EE">
<span style="{{p.avatarStyle}}">{{p.initial}}</span>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex-grow: 1">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<span style="font-weight: 800; font-size: 16px">{{p.name}}</span>
<span style="flex-shrink: 0; font-size: 12px; font-weight: 700; color: #5E5470">pour 4</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 4px">
<sc-for list="{{p.ingredients}}" as="ing" hint-placeholder-count="3">
<span style="{{ing.style}}">{{ing.name}}</span>
</sc-for>
</div>
</div>
</div>
</sc-for>
<sc-if value="{{none}}" hint-placeholder-val="{{false}}">
<div style="padding: 24px; border-radius: 20px; border: 2px dashed #CFC6DE; text-align: center; font-weight: 600; color: #5E5470">Aucun plat ne correspond</div>
</sc-if>
</div>

</div>

<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 10px 16px 18px; background: #FFFFFF; border-top: 1.5px solid #E7E1EE; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<a href="Doux-Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; color: #5E5470; text-decoration: none; font-size: 12px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>Planning</a>
<a href="Doux-Bibliotheque.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; background: #C63D24; color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 800"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5"></path><path d="M9 8h6"></path></svg>Plats</a>
<a href="Doux-Courses.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; color: #5E5470; text-decoration: none; font-size: 12px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"></path><circle cx="10" cy="20" r="1.3"></circle><circle cx="17" cy="20" r="1.3"></circle></svg>Courses</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: 'courg' };
  }
  renderVals() {
    var tint = function (h) { var n = parseInt(h.slice(1), 16), f = function (c) { return Math.round(c + (255 - c) * 0.6); }; return 'rgb(' + f(n >> 16) + ', ' + f((n >> 8) & 255) + ', ' + f(n & 255) + ')'; };
    var self = this;
    var norm = function (s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); };
    var words = function (s) { return norm(s).split(/[^a-z0-9]+/).filter(function (w) { return w.length > 0; }); };
    var plats = [
      { name: 'Chili con carne', color: '#C2502E', ing: ['bœuf haché', 'haricots rouges', 'oignon', 'tomate concassée'] },
      { name: 'Chili végétarien', color: '#3F7F25', ing: ['haricots rouges', 'maïs', 'oignon', 'poivron'] },
      { name: 'Gratin de courgettes', color: '#2F6FB0', ing: ['courgette', 'crème', 'gruyère'] },
      { name: 'Gratin dauphinois', color: '#B0306A', ing: ['pomme de terre', 'crème', 'ail'] },
      { name: 'Ratatouille', color: '#B36A0B', ing: ['courgette', 'aubergine', 'tomate', 'poivron', 'oignon'] },
      { name: "Soupe à l'oignon", color: '#8A45B3', ing: ['oignon', 'bouillon', 'pain', 'gruyère'] },
      { name: 'Pâtes pesto', color: '#2E8A6E', ing: ['pâtes', 'basilic', 'parmesan', 'pignons'] },
      { name: 'Pizza maison', color: '#9C7400', ing: ['farine', 'mozzarella', 'tomate concassée', 'jambon'] }
    ];
    var qw = words(this.state.q);
    var hits = function (text) {
      var tw = words(text);
      return qw.some(function (q) { return tw.some(function (t) { return t.indexOf(q) === 0; }); });
    };
    var matches = plats.filter(function (p) {
      var tw = words(p.name + ' ' + p.ing.join(' '));
      return qw.every(function (q) { return tw.some(function (t) { return t.indexOf(q) === 0; }); });
    });
    var chip = function (on, color) {
      return 'padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: ' + (on ? '800' : '600') + '; color: ' + (on ? color : '#5E5470') + '; border: 1.5px solid ' + (on ? tint(color) : '#E7E1EE');
    };
    var n = matches.length;
    return {
      q: this.state.q,
      onQ: function (e) { self.setState({ q: e.target.value }); },
      none: n === 0,
      countLabel: qw.length === 0 ? plats.length + ' plats' : n + (n > 1 ? ' résultats' : ' résultat') + ' pour « ' + this.state.q + ' »',
      results: matches.map(function (p) {
        return {
          name: p.name,
          initial: p.name.charAt(0),
          avatarStyle: 'flex-shrink: 0; width: 44px; height: 44px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid ' + tint(p.color) + '; display: flex; align-items: center; justify-content: center; font-family: Bricolage Grotesque, sans-serif; font-weight: 800; font-size: 20px; color: ' + p.color,
          ingredients: p.ing.map(function (i) { return { name: i, style: chip(qw.length > 0 && hits(i), p.color) }; })
        };
      })
    };
  }
}
</script>
</body>
</html>
