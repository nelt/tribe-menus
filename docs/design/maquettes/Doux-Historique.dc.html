<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Historique des listes de courses</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',sans-serif;color:#22193A;background:#FFFFFF}
a{color:#C63D24}a:hover{color:#9E2E19}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Figtree', sans-serif; color: #22193A">

<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 84px; overflow-y: auto">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 28px">

<a href="Doux-ListesCourses.dc.html" style="display: flex; align-items: center; gap: 4px; min-height: 44px; font-size: 15px; font-weight: 700; color: #22193A; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>Listes</a>

<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px">Historique</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.4; color: #5E5470">Les listes dont les courses sont faites, de la plus récente à la plus ancienne. Elles se consultent en lecture seule.</p>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 6px 0 0; font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #5E5470">{{g.month}}</h2>
<sc-for list="{{g.lists}}" as="l" hint-placeholder-count="3">
<a href="Doux-CoursesFaite.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; border: 1.5px solid #E7E1EE; color: #22193A; text-decoration: none">
<span style="width: 40px; height: 40px; flex-shrink: 0; box-sizing: border-box; border-radius: 12px; border: 1.5px solid #A9D3B1; color: #2F7A3E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 19px">{{l.period}}</span>
<span style="font-size: 13px; font-weight: 600; color: #5E5470">{{l.detail}}</span>
</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5470" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M9 18l6-6-6-6"></path></svg>
</a>
</sc-for>
</div>
</sc-for>

</div>
</div>

<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 10px 16px 18px; background: #FFFFFF; border-top: 1.5px solid #E7E1EE; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<a href="Doux-Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; color: #5E5470; text-decoration: none; font-size: 12px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>Planning</a>
<a href="Doux-Bibliotheque.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; color: #5E5470; text-decoration: none; font-size: 12px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5"></path><path d="M9 8h6"></path></svg>Plats</a>
<a href="Doux-ListesCourses.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; background: #C63D24; color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 800"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"></path><circle cx="10" cy="20" r="1.3"></circle><circle cx="17" cy="20" r="1.3"></circle></svg>Courses</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      groups: [
        { month: 'Octobre 2026', lists: [
          { period: '29 sept. → 5 oct.', detail: 'Faite le sam. 3 oct. · 14 articles, 2 non cochés' }
        ] },
        { month: 'Septembre 2026', lists: [
          { period: '22 → 28 sept.', detail: 'Faite le sam. 26 sept. · 12 articles' },
          { period: '19 → 20 sept.', detail: 'Faite le ven. 18 sept. · 5 articles' },
          { period: '15 → 21 sept.', detail: 'Faite le dim. 13 sept. · 16 articles, 1 non coché' },
          { period: '8 → 14 sept.', detail: 'Faite le sam. 5 sept. · 13 articles' },
          { period: '1er → 7 sept.', detail: 'Faite le lun. 31 août · 15 articles' }
        ] },
        { month: 'Août 2026', lists: [
          { period: '25 → 31 août', detail: 'Faite le lun. 24 août · 11 articles' }
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
