<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Choix des listes de courses</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',sans-serif;color:#22193A;background:#FFFFFF}
a{color:#C63D24}a:hover{color:#9E2E19}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Figtree', sans-serif; color: #22193A">

<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 84px; overflow-y: auto">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 28px">

<a href="Doux-Courses.dc.html" style="display: flex; align-items: center; gap: 4px; min-height: 44px; font-size: 15px; font-weight: 700; color: #22193A; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>Retour à la liste</a>

<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.5px">Listes</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.4; color: #5E5470">La liste principale s’ouvre dans l’onglet Courses et reçoit par défaut les courses des repas.</p>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{lists}}" as="l" hint-placeholder-count="3">
<div style="{{l.cardStyle}}">
<a href="Doux-Courses.dc.html" style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 14px 0 14px 16px; color: #22193A; text-decoration: none">
<div style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">{{l.name}}</span>
<sc-if value="{{l.main}}" hint-placeholder-val="{{false}}">
<span style="padding: 3px 10px; border-radius: 999px; border: 1.5px solid #22193A; font-size: 12px; font-weight: 800">principale</span>
</sc-if>
<sc-if value="{{l.stale}}" hint-placeholder-val="{{false}}">
<span style="padding: 3px 10px; border-radius: 999px; border: 1.5px solid #F2D27A; font-size: 12px; font-weight: 800; color: #8A6100">Repas modifiés</span>
</sc-if>
</div>
<span style="font-size: 14px; font-weight: 600; color: #5E5470">{{l.summary}}</span>
<sc-if value="{{l.hasItems}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; gap: 10px">
<div style="flex-grow: 1; height: 8px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #A9D3B1; overflow: hidden"><div style="{{l.barStyle}}"></div></div>
<span style="font-size: 13px; font-weight: 700">{{l.progress}}</span>
</div>
</sc-if>
</a>
<button onClick="{{l.openActions}}" aria-label="{{l.actionsLabel}}" style="width: 48px; min-height: 56px; flex-shrink: 0; border: none; border-radius: 16px; background: transparent; color: #22193A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"></circle><circle cx="12" cy="12" r="1.9"></circle><circle cx="12" cy="19" r="1.9"></circle></svg></button>
</div>
</sc-for>
</div>

<sc-if value="{{creating}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 16px; border: 1.5px solid #E39A89">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #5E5470">Nom de la liste
<input type="text" value="{{newName}}" onChange="{{typeNewName}}" placeholder="ex. Marché, Drive" style="height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 2px solid #22193A; font-size: 16px; font-weight: 700; color: #22193A"></label>
<div style="display: flex; gap: 8px">
<button onClick="{{confirmCreate}}" style="flex-grow: 1; height: 46px; border: none; border-radius: 14px; background: #C63D24; color: #FFFFFF; font-size: 15px; font-weight: 800; cursor: pointer">Créer la liste</button>
<button onClick="{{cancelCreate}}" style="height: 46px; padding: 0 14px; border: none; border-radius: 14px; background: transparent; color: #22193A; font-size: 15px; font-weight: 700; cursor: pointer">Annuler</button>
</div>
</div>
</sc-if>
<sc-if value="{{notCreating}}" hint-placeholder-val="{{true}}">
<button onClick="{{startCreate}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border: none; border-radius: 18px; background: #C63D24; color: #FFFFFF; font-size: 16px; font-weight: 800; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Nouvelle liste</button>
</sc-if>

</div>
</div>

<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 10px 16px 18px; background: #FFFFFF; border-top: 1.5px solid #E7E1EE; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<a href="Doux-Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; color: #5E5470; text-decoration: none; font-size: 12px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>Planning</a>
<a href="Doux-Bibliotheque.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; color: #5E5470; text-decoration: none; font-size: 12px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5"></path><path d="M9 8h6"></path></svg>Plats</a>
<a href="Doux-Courses.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; background: #C63D24; color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 800"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"></path><circle cx="10" cy="20" r="1.3"></circle><circle cx="17" cy="20" r="1.3"></circle></svg>Courses</a>
</nav>

<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; background: rgba(34, 25, 58, 0.45); display: flex; flex-direction: column; justify-content: flex-end">
<div role="dialog" aria-modal="true" aria-labelledby="liste-titre" style="display: flex; flex-direction: column; gap: 10px; padding: 22px 20px 28px; border-radius: 26px 26px 0 0; background: #FFFFFF">
<div style="display: flex; align-items: center; gap: 8px">
<h2 id="liste-titre" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">{{sheetName}}</h2>
<sc-if value="{{sheetMain}}" hint-placeholder-val="{{false}}">
<span style="padding: 3px 10px; border-radius: 999px; border: 1.5px solid #22193A; font-size: 12px; font-weight: 800">principale</span>
</sc-if>
</div>

<sc-if value="{{renaming}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #5E5470">Nom de la liste
<input type="text" value="{{draft}}" onChange="{{typeDraft}}" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 16px; border: 2px solid #22193A; font-size: 17px; font-weight: 700; color: #22193A"></label>
<button onClick="{{confirmRename}}" style="height: 54px; border: none; border-radius: 18px; background: #C63D24; color: #FFFFFF; font-size: 16px; font-weight: 800; cursor: pointer">Enregistrer</button>
</div>
</sc-if>

<sc-if value="{{notRenaming}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<button onClick="{{startRename}}" style="display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 14px; border: 1.5px solid #E7E1EE; border-radius: 16px; background: #FFFFFF; color: #22193A; font-size: 16px; font-weight: 700; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg>Renommer</button>
<sc-if value="{{canMakeMain}}" hint-placeholder-val="{{true}}">
<button onClick="{{makeMain}}" style="display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 14px; border: 1.5px solid #E7E1EE; border-radius: 16px; background: #FFFFFF; color: #22193A; font-size: 16px; font-weight: 700; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"></path></svg>Définir comme liste principale</button>
</sc-if>
<sc-if value="{{canDelete}}" hint-placeholder-val="{{false}}">
<button onClick="{{deleteList}}" style="display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 14px; border: 1.5px solid #C63D24; border-radius: 16px; background: #FFFFFF; color: #C63D24; font-size: 16px; font-weight: 800; text-align: left; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>Supprimer la liste</button>
</sc-if>
<sc-if value="{{cannotDelete}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border: 2px dashed #CFC6DE; border-radius: 16px; color: #6E6680">
<span style="font-size: 16px; font-weight: 800">Supprimer la liste</span>
<span style="font-size: 13px; font-weight: 600; line-height: 1.4; color: #5E5470">{{deleteReason}}</span>
</div>
</sc-if>
</div>
</sc-if>

<button onClick="{{closeSheet}}" style="height: 50px; border: none; border-radius: 16px; background: transparent; color: #22193A; font-size: 16px; font-weight: 700; cursor: pointer">Fermer</button>
</div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      lists: [
        { id: 'courses', name: 'Courses', count: 11, checked: 2, stale: true },
        { id: 'marche', name: 'Marché', count: 4, checked: 0, stale: false },
        { id: 'drive', name: 'Drive', count: 0, checked: 0, stale: false }
      ],
      mainId: 'courses',
      sheet: null,
      renaming: false,
      draft: '',
      creating: false,
      newName: ''
    };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var set = function (s) { return function () { self.setState(s); }; };
    var ordered = st.lists.filter(function (l) { return l.id === st.mainId; }).concat(st.lists.filter(function (l) { return l.id !== st.mainId; }));
    var cur = st.lists.filter(function (l) { return l.id === st.sheet; })[0] || null;
    var curMain = !!cur && cur.id === st.mainId;
    var curEmpty = !!cur && cur.count === 0;
    return {
      lists: ordered.map(function (l) {
        var main = l.id === st.mainId;
        return {
          name: l.name,
          main: main,
          stale: l.stale,
          hasItems: l.count > 0,
          summary: l.count === 0 ? 'Vide' : l.count + (l.count > 1 ? ' articles' : ' article') + ' · ' + (l.count - l.checked) + ' à prendre',
          progress: l.checked + ' sur ' + l.count,
          barStyle: 'height: 100%; border-radius: 999px; background: #2F7A3E; width: ' + (l.count ? Math.round(l.checked * 100 / l.count) : 0) + '%',
          actionsLabel: 'Actions pour la liste ' + l.name,
          cardStyle: 'display: flex; align-items: stretch; border-radius: 22px; background: #FFFFFF; border: 1.5px solid ' + (main ? '#22193A' : '#E7E1EE'),
          openActions: set({ sheet: l.id, renaming: false, draft: l.name })
        };
      }),
      creating: st.creating,
      notCreating: !st.creating,
      newName: st.newName,
      typeNewName: function (e) { self.setState({ newName: e.target.value }); },
      startCreate: set({ creating: true }),
      cancelCreate: set({ creating: false, newName: '' }),
      confirmCreate: function () {
        var name = (self.state.newName || '').trim();
        if (!name) { return; }
        self.setState({ lists: self.state.lists.concat([{ id: 'l' + Date.now(), name: name, count: 0, checked: 0, stale: false }]), creating: false, newName: '' });
      },
      sheetOpen: !!cur,
      sheetName: cur ? cur.name : '',
      sheetMain: curMain,
      renaming: st.renaming,
      notRenaming: !st.renaming,
      draft: st.draft,
      typeDraft: function (e) { self.setState({ draft: e.target.value }); },
      startRename: set({ renaming: true }),
      confirmRename: function () {
        var name = (self.state.draft || '').trim();
        if (!name || !cur) { return; }
        self.setState({ lists: self.state.lists.map(function (l) { return l.id === cur.id ? Object.assign({}, l, { name: name }) : l; }), renaming: false });
      },
      canMakeMain: !!cur && !curMain,
      makeMain: function () { if (cur) { self.setState({ mainId: cur.id, sheet: null }); } },
      canDelete: !!cur && !curMain && curEmpty,
      cannotDelete: !!cur && (curMain || !curEmpty),
      deleteReason: curMain ? 'Désignez d’abord une autre liste comme principale.' : 'Une liste doit être vide pour être supprimée.',
      deleteList: function () { if (cur) { self.setState({ lists: self.state.lists.filter(function (l) { return l.id !== cur.id; }), sheet: null }); } },
      closeSheet: set({ sheet: null, renaming: false })
    };
  }
}
</script>
</body>
</html>
