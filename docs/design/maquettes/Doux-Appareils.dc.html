<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mes appareils</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',sans-serif;color:#22193A;background:#FFFFFF}
a{color:#C63D24}a:hover{color:#9E2E19}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Figtree', sans-serif; color: #22193A">

<div style="display: flex; flex-direction: column; gap: 16px; padding: 20px 20px 0">

<a href="Doux-Tribu.dc.html" style="display: flex; align-items: center; gap: 4px; min-height: 44px; font-size: 15px; font-weight: 700; color: #22193A; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>Tribu</a>

<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px">Mes appareils</h1>
<span style="font-size: 14px; font-weight: 600; color: #5E5470">Connectés à la tribu Les Martin</span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{sessions}}" as="s" hint-placeholder-count="3">
<div style="{{s.cardStyle}}">
<div style="display: flex; align-items: flex-start; gap: 10px">
<span style="{{s.iconStyle}}">
<sc-if value="{{s.isPhone}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"></rect><path d="M11 18h2"></path></svg></sc-if>
<sc-if value="{{s.isTablet}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"></rect><path d="M11 17.5h2"></path></svg></sc-if>
<sc-if value="{{s.isComputer}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M2 20h20"></path></svg></sc-if>
</span>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1">
<sc-if value="{{s.editing}}" hint-placeholder-val="{{false}}">
<label style="display: flex; align-items: center; gap: 6px">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Nom de l’appareil</span>
<input type="text" value="{{s.draft}}" onChange="{{s.onDraft}}" style="flex-grow: 1; min-width: 0; height: 40px; box-sizing: border-box; padding: 0 10px; border-radius: 12px; border: 2px solid #22193A; font-size: 15px; font-weight: 700; color: #22193A">
<button onClick="{{s.save}}" style="flex-shrink: 0; height: 40px; padding: 0 12px; border: none; border-radius: 12px; background: #C63D24; color: #FFFFFF; font-size: 14px; font-weight: 800; cursor: pointer">OK</button>
</label>
</sc-if>
<sc-if value="{{s.notEditing}}" hint-placeholder-val="{{true}}">
<span style="font-weight: 800; font-size: 16px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{s.title}}</span>
</sc-if>
<sc-if value="{{s.hasDetected}}" hint-placeholder-val="{{false}}">
<span style="font-size: 13px; font-weight: 600; color: #5E5470">{{s.detected}}</span>
</sc-if>
<span style="font-size: 13px; font-weight: 600; color: #5E5470">{{s.dates}}</span>
</div>
<sc-if value="{{s.current}}" hint-placeholder-val="{{false}}">
<span style="flex-shrink: 0; padding: 3px 10px; border-radius: 999px; border: 1.5px solid #A9D3B1; font-size: 12px; font-weight: 800; color: #2F7A3E">cet appareil</span>
</sc-if>
</div>
<div style="{{s.actionsStyle}}">
<button onClick="{{s.edit}}" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: 14px; border: 1.5px solid #E7E1EE; background: #FFFFFF; color: #22193A; font-size: 14px; font-weight: 700; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Renommer</button>
<sc-if value="{{s.notCurrent}}" hint-placeholder-val="{{true}}">
<button onClick="{{s.revoke}}" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: 14px; border: 1.5px solid #E7E1EE; background: #FFFFFF; color: #C63D24; font-size: 14px; font-weight: 700; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path><path d="M10 17l-5-5 5-5M5 12h11"></path></svg>Déconnecter</button>
</sc-if>
</div>
</div>
</sc-for>
</div>

</div>

<div style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; flex-direction: column; gap: 6px">
<sc-if value="{{hasOthers}}" hint-placeholder-val="{{true}}">
<button onClick="{{revokeOthers}}" style="height: 52px; border-radius: 16px; border: 2px solid #22193A; background: #FFFFFF; color: #22193A; font-size: 16px; font-weight: 800; cursor: pointer">Déconnecter tous les autres appareils</button>
</sc-if>
<button style="height: 48px; border: none; border-radius: 16px; background: transparent; color: #C63D24; font-size: 16px; font-weight: 800; cursor: pointer">Se déconnecter de cet appareil</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      editing: null,
      draft: '',
      sessions: [
        { id: 'a', kind: 'phone', name: '', detected: 'iPhone · Safari · app installée', dates: 'Ouverte le 1er oct. · active maintenant', current: true },
        { id: 'b', kind: 'tablet', name: 'Tablette de cuisine', detected: 'iPad · Safari · app installée', dates: 'Ouverte le 20 août · active il y a 3 j', current: false },
        { id: 'c', kind: 'computer', name: '', detected: 'Ordinateur · Windows · Firefox', dates: 'Ouverte le 14 sept. · active hier', current: false }
      ]
    };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var sessions = st.sessions.map(function (s) {
      var editing = st.editing === s.id;
      return {
        title: s.name || s.detected,
        detected: s.detected,
        hasDetected: !!s.name,
        dates: s.dates,
        current: s.current,
        notCurrent: !s.current,
        isPhone: s.kind === 'phone',
        isTablet: s.kind === 'tablet',
        isComputer: s.kind === 'computer',
        editing: editing,
        notEditing: !editing,
        draft: st.draft,
        cardStyle: 'display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 20px; border: 1.5px solid ' + (s.current ? '#A9D3B1' : '#E7E1EE'),
        iconStyle: 'width: 40px; height: 40px; flex-shrink: 0; box-sizing: border-box; border-radius: 12px; border: 1.5px solid ' + (s.current ? '#A9D3B1' : '#E7E1EE') + '; color: ' + (s.current ? '#2F7A3E' : '#5E5470') + '; display: flex; align-items: center; justify-content: center',
        actionsStyle: 'display: grid; grid-template-columns: repeat(' + (s.current ? 1 : 2) + ', minmax(0, 1fr)); gap: 8px',
        edit: function () { self.setState({ editing: s.id, draft: s.name || '' }); },
        onDraft: function (e) { self.setState({ draft: e.target.value }); },
        save: function () {
          var v = self.state.draft.trim();
          self.setState({ editing: null, sessions: self.state.sessions.map(function (x) { return x.id === s.id ? Object.assign({}, x, { name: v }) : x; }) });
        },
        revoke: function () { self.setState({ sessions: self.state.sessions.filter(function (x) { return x.id !== s.id; }) }); }
      };
    });
    return {
      sessions: sessions,
      hasOthers: st.sessions.length > 1,
      revokeOthers: function () { self.setState({ editing: null, sessions: self.state.sessions.filter(function (x) { return x.current; }) }); }
    };
  }
}
</script>
</body>
</html>
