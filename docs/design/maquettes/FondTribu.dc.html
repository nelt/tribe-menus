<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fond d’accueil de la tribu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div aria-hidden="true" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #22193A; font-family: 'Figtree', sans-serif; color: #22193A">
<sc-for list="{{layers}}" as="l" hint-placeholder-count="24">
<svg viewBox="0 0 48 48" width="{{l.size}}" height="{{l.size}}" style="{{l.style}}"><path d="{{l.d}}" fill="{{l.fill}}" stroke="{{l.stroke}}" stroke-width="{{l.sw}}" stroke-linejoin="round" stroke-linecap="round"></path></svg>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844},"graine":{"editor":"int","default":7,"min":1,"max":999},"densite":{"editor":"enum","options":["chargée","foule","cohue"],"default":"foule"},"adoucissement":{"editor":"range","default":0.1,"min":0,"max":0.5,"step":0.05},"contour":{"editor":"boolean","default":true}}'>
class Component extends DCLogic {
  renderVals() {
    var seed = (this.props.graine ?? 7) >>> 0;
    var rand = function () {
      seed = (seed + 0x6D2B79F5) >>> 0;
      var t = seed;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    var pick = function (a) { return a[Math.floor(rand() * a.length)]; };
    var k = this.props.adoucissement ?? 0.1;
    var soft = function (h) {
      if (h.charAt(0) !== '#') { return h; }
      var n = parseInt(h.slice(1), 16);
      var f = function (c) { return Math.round(c + (255 - c) * k); };
      return 'rgb(' + f(n >> 16) + ', ' + f((n >> 8) & 255) + ', ' + f(n & 255) + ')';
    };
    var outline = this.props.contour ?? true;

    var vivid = ['#C2502E', '#3F7F25', '#2F6FB0', '#B0306A', '#B36A0B', '#8A45B3', '#2E8A6E', '#9C7400', '#C63D24', '#3D3A8C', '#F2D27A', '#BDBAF0', '#A9D3B1', '#E39A89'];
    var skins = ['#F6D2B4', '#E8B48C', '#C98B5E', '#9A6440', '#6B4428'];
    var hairs = ['#22193A', '#5A3A22', '#8A5A2B', '#D9A441', '#C2502E', '#B7B0C2', '#FFFFFF'];
    var roles = {
      red: function () { return pick(['#C63D24', '#C2502E', '#B0306A']); },
      green: function () { return pick(['#3F7F25', '#2E8A6E']); },
      yellow: function () { return pick(['#F2C94C', '#F2D27A']); },
      orange: function () { return pick(['#E07B1F', '#B36A0B']); },
      purple: function () { return pick(['#8A45B3', '#3D3A8C']); },
      blue: function () { return pick(['#2F6FB0', '#BDBAF0']); },
      crust: function () { return '#D9A25B'; },
      cream: function () { return '#FFF1D6'; },
      white: function () { return '#FFFFFF'; },
      dark: function () { return '#22193A'; },
      main: function () { return pick(vivid); }
    };

    var H = 'M14 19a10 10 0 1 0 20 0a10 10 0 1 0-20 0z';
    var EYES = 'M19.2 19a1.4 1.4 0 1 0 2.8 0a1.4 1.4 0 1 0-2.8 0z M26 19a1.4 1.4 0 1 0 2.8 0a1.4 1.4 0 1 0-2.8 0z M20 23h8a4 3.6 0 0 1-8 0z';
    var BODY = 'M7 48c0-12 7-18 17-18s17 6 17 18z';
    var people = [
      [[BODY, 'shirt'], [H, 'skin'], ['M14 18c0-8 5-12 10-12s10 4 10 12c-3-4-7-5-10-5s-7 1-10 5z', 'hair'], [EYES, 'eyes']],
      [[BODY, 'shirt'], [H, 'skin'], ['M20 6a4 4 0 1 0 8 0a4 4 0 1 0-8 0z M14 17c0-7 5-10 10-10s10 3 10 10c-2-3-6-4-10-4s-8 1-10 4z', 'hair'], [EYES, 'eyes']],
      [['M11 48c0-10 6-15 13-15s13 5 13 15z', 'shirt'], ['M9 16a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0-9 0z M30 16a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0-9 0z', 'hair'], ['M15 21a9 9 0 1 0 18 0a9 9 0 1 0-18 0z', 'skin'], ['M19.8 21a1.3 1.3 0 1 0 2.6 0a1.3 1.3 0 1 0-2.6 0z M25.6 21a1.3 1.3 0 1 0 2.6 0a1.3 1.3 0 1 0-2.6 0z M20.5 24.5h7a3.5 3.2 0 0 1-7 0z', 'eyes']],
      [[BODY, 'shirt'], [H, 'skin'], ['M13 16c0-7 5-10 11-10s11 3 11 10z M33 14h8v3.5H31z', 'cap'], [EYES, 'eyes']],
      [[BODY, 'shirt'], ['M11 15a5 5 0 1 0 10 0a5 5 0 1 0-10 0z M19 10a5 5 0 1 0 10 0a5 5 0 1 0-10 0z M27 15a5 5 0 1 0 10 0a5 5 0 1 0-10 0z', 'hair'], [H, 'skin'], [EYES, 'eyes']],
      [[BODY, 'shirt'], [H, 'skin'], ['M14 17c0-7 5-11 10-11s10 4 10 11c-3-3-7-4-10-4s-7 1-10 4z M14 21c1 10 19 10 20 0c-2 3-6 4-10 4s-8-1-10-4z', 'hair'], ['M19.2 18a1.4 1.4 0 1 0 2.8 0a1.4 1.4 0 1 0-2.8 0z M26 18a1.4 1.4 0 1 0 2.8 0a1.4 1.4 0 1 0-2.8 0z', 'eyes']],
      [[BODY, 'shirt'], ['M12 19c0-9 5-13 12-13s12 4 12 13v12h-6V19H18v12h-6z', 'hair'], [H, 'skin'], [EYES, 'eyes']]
    ];
    var foods = [
      [['M24 14c-10 0-16 6-16 14s6 13 16 13 16-5 16-13-6-14-16-14z', 'red'], ['M24 16l-7-4 4 5-7 1 7 2 3-1 3 1 7-2-7-1 4-5z', 'green']],
      [['M37 11L9 40l5 4 27-28z', 'orange'], ['M37 11c-1-4 1-8 4-9 0 3 1 5 3 6-2 2-4 3-7 3z', 'green']],
      [['M5 24c7-9 19-11 27-3l9-6v18l-9-6c-8 8-20 6-27-3z', 'blue'], ['M12 21.5a2 2 0 1 0 4 0a2 2 0 1 0-4 0z', 'white']],
      [['M9 25c0-9 8-15 16-13s13 5 13 13-6 14-15 13S9 34 9 25z', 'white'], ['M18 25a6 6 0 1 0 12 0a6 6 0 1 0-12 0z', 'yellow']],
      [['M5 35L41 18v18H5z', 'yellow'], ['M16 31a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0z M29 27a3 3 0 1 0 6 0a3 3 0 1 0-6 0z M31 33a2 2 0 1 0 4 0a2 2 0 1 0-4 0z', 'cream']],
      [['M11 16c8-4 18-4 26 0L24 44z', 'yellow'], ['M8 11c10-5 22-5 32 0l-3 6c-8-4-18-4-26 0z', 'crust'], ['M19 22a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0z M26 27a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0z M21 32a2 2 0 1 0 4 0a2 2 0 1 0-4 0z', 'red']],
      [['M5 24h38c0 10-8 17-19 17S5 34 5 24z', 'main'], ['M5 24c0-2.5 8-4.5 19-4.5s19 2 19 4.5z', 'orange']],
      [['M6 38L35 9c3-3 8 1 5 5L11 43c-3 3-8-2-5-5z', 'crust']],
      [['M9 21h30v13a6 6 0 0 1-6 6H15a6 6 0 0 1-6-6z', 'main'], ['M5 18h38v4H5z M20 13h8v5h-8z', 'dark']],
      [['M18 25h12v11a6 6 0 0 1-12 0z', 'cream'], ['M5 26a19 16 0 0 1 38 0z', 'red'], ['M14 19a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0z M26 15a3 3 0 1 0 6 0a3 3 0 1 0-6 0z M33 21a2 2 0 1 0 4 0a2 2 0 1 0-4 0z', 'white']],
      [['M7 25c0-8 7-14 17-14s17 6 17 14-7 14-17 14S7 33 7 25z', 'yellow']],
      [['M24 15c-4-4-15-3-15 9 0 10 7 18 15 15 8 3 15-5 15-15 0-12-11-13-15-9z', 'red'], ['M24 15c0-4 2-8 7-9-1 4-3 7-7 9z', 'green']],
      [['M31 14c8 2 12 10 8 18s-16 12-25 8-5-14 3-20c4-3 9-7 14-6z', 'purple'], ['M31 14l6-7 1 6 5 2-6 3z', 'green']],
      [['M10 40C10 20 22 9 40 9c0 18-12 30-30 31z', 'green']],
      [['M8 27c2-9 10-13 16-13s14 4 16 13c-4-3-8-3-11 0-3-3-7-3-10 0-3-3-7-3-11 0z', 'crust'], ['M8 27c4-3 8-3 11 0 3-3 7-3 10 0 3-3 7-3 11 0l-3 13H11z', 'crust']]
    ];

    var dens = this.props.densite ?? 'foule';
    var cols = dens === 'cohue' ? 8 : (dens === 'chargée' ? 6 : 7);
    var rows = dens === 'cohue' ? 16 : (dens === 'chargée' ? 11 : 13);
    var perCell = dens === 'cohue' ? 3 : 2;
    var cw = 450 / cols, ch = 904 / rows;
    var items = [];
    var fillers = people.concat([foods[0], foods[3], foods[6], foods[8], foods[10], foods[11], foods[14]]);
    var step = 52;
    for (var fy = -50; fy < 884; fy += step) {
      for (var fx = -50; fx < 420; fx += step) {
        var fs = Math.round(104 + rand() * 26);
        items.push({
          z: -1 + rand() * 0.5,
          shape: pick(fillers),
          size: fs,
          x: Math.round(fx + rand() * step - fs / 3),
          y: Math.round(fy + rand() * step - fs / 3),
          rot: Math.round(rand() * 60 - 30),
          colors: { skin: pick(skins), hair: pick(hairs), shirt: pick(vivid), cap: pick(vivid) }
        });
      }
    }
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        for (var n = 0; n < perCell; n++) {
          var isPerson = rand() < 0.5;
          var shape = isPerson ? pick(people) : pick(foods);
          var size = Math.round(52 + rand() * 40);
          var x = Math.round(c * cw - 30 + rand() * cw - size / 3);
          var y = Math.round(r * ch - 30 + rand() * ch - size / 3);
          var rot = Math.round(rand() * (isPerson ? 30 : 70) - (isPerson ? 15 : 35));
          var colors = { skin: pick(skins), hair: pick(hairs), shirt: pick(vivid), cap: pick(vivid) };
          items.push({ z: rand(), shape: shape, size: size, x: x, y: y, rot: rot, colors: colors });
        }
      }
    }
    items.sort(function (a, b) { return a.z - b.z; });
    var layers = [];
    items.forEach(function (it) {
      var style = 'position: absolute; left: ' + it.x + 'px; top: ' + it.y + 'px; transform: rotate(' + it.rot + 'deg); overflow: visible';
      it.shape.forEach(function (part) {
        var role = part[1];
        var isEyes = role === 'eyes';
        var fill = isEyes ? '#22193A' : (it.colors[role] || roles[role]());
        layers.push({
          d: part[0],
          size: it.size,
          style: style,
          fill: isEyes ? fill : soft(fill),
          stroke: (outline && !isEyes) ? '#22193A' : 'none',
          sw: 1.8
        });
      });
    });
    return { layers: layers };
  }
}
</script>
</body>
</html>
