<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Liste de courses (liserés doux)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',sans-serif;color:#22193A;background:#FFFFFF}
a{color:#C63D24}a:hover{color:#9E2E19}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Figtree', sans-serif; color: #22193A">

<div style="display: flex; flex-direction: column; gap: 14px; padding: 24px 20px 100px">

<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; letter-spacing: -0.5px">Courses</h1>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 56px; padding: 7px 14px; border: 2px solid #22193A; border-radius: 16px; background: #FFFFFF; color: #22193A; text-align: left; cursor: pointer"><span style="font-size: 12px; font-weight: 700; color: #5E5470">Du</span><span style="font-size: 16px; font-weight: 800">mar. 6 oct.</span></button>
<button style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 56px; padding: 7px 14px; border: 2px solid #22193A; border-radius: 16px; background: #FFFFFF; color: #22193A; text-align: left; cursor: pointer"><span style="font-size: 12px; font-weight: 700; color: #5E5470">Au</span><span style="font-size: 16px; font-weight: 800">lun. 12 oct.</span></button>
</div>

<div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 16px; border: 1.5px solid #BDBAF0; color: #3D3A8C">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5F5BD0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M2 8.8a15 15 0 0 1 4.2-2.6M9.5 5.1A15 15 0 0 1 22 8.8"></path><path d="M5 12.6a10 10 0 0 1 3.6-2M16.4 11a10 10 0 0 1 2.6 1.6"></path><path d="M8.5 16.2a5 5 0 0 1 7 0"></path><circle cx="12" cy="20" r="1"></circle><path d="M3 3l18 18"></path></svg>
<span style="font-size: 14px; font-weight: 700; line-height: 1.35">Hors ligne · vos coches seront synchronisées au retour du réseau</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 700"><span>{{progressLabel}}</span><span style="color: #5E5470">{{remainingLabel}}</span></div>
<div style="height: 10px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #A9D3B1; overflow: hidden"><div style="{{barStyle}}"></div></div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="9">
<label style="{{it.rowStyle}}">
<input type="checkbox" checked="{{it.checked}}" onChange="{{it.toggle}}" style="width: 24px; height: 24px; margin: 0; flex-shrink: 0; accent-color: #2F7A3E; cursor: pointer">
<span style="{{it.nameStyle}}">{{it.name}}</span>
<span style="{{it.qtyStyle}}">{{it.qty}}</span>
</label>
</sc-for>
</div>

</div>

<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 10px 16px 18px; background: #FFFFFF; border-top: 1.5px solid #E7E1EE; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<a href="Doux-Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; color: #5E5470; text-decoration: none; font-size: 12px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>Planning</a>
<a href="Doux-Bibliotheque.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; color: #5E5470; text-decoration: none; font-size: 12px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5"></path><path d="M9 8h6"></path></svg>Plats</a>
<a href="Doux-Courses.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; background: #C63D24; color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 800"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"></path><circle cx="10" cy="20" r="1.3"></circle><circle cx="17" cy="20" r="1.3"></circle></svg>Courses</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { checked: { pates: true, basilic: true, creme: true } };
  }
  renderVals() {
    var self = this;
    var list = [
      { id: 'boeuf', name: 'Bœuf haché', qty: '875 g' },
      { id: 'haricots', name: 'Haricots rouges', qty: '800 g' },
      { id: 'oignon', name: 'Oignon', qty: '6 pièces' },
      { id: 'courgette', name: 'Courgette', qty: '3 pièces' },
      { id: 'gruyere', name: 'Gruyère', qty: '400 g' },
      { id: 'mozzarella', name: 'Mozzarella', qty: '250 g' },
      { id: 'creme', name: 'Crème', qty: '50 cl' },
      { id: 'pates', name: 'Pâtes', qty: '500 g' },
      { id: 'basilic', name: 'Basilic', qty: '1 pièce' }
    ];
    var c = this.state.checked;
    var done = list.filter(function (x) { return c[x.id]; }).length;
    var sorted = list.filter(function (x) { return !c[x.id]; }).concat(list.filter(function (x) { return c[x.id]; }));
    return {
      progressLabel: done + ' sur ' + list.length + ' articles',
      remainingLabel: (list.length - done) + ' à prendre',
      barStyle: 'height: 100%; border-radius: 999px; background: #2F7A3E; width: ' + Math.round(done * 100 / list.length) + '%',
      items: sorted.map(function (x) {
        var on = !!c[x.id];
        return {
          name: x.name,
          qty: x.qty,
          checked: on,
          toggle: function () {
            var next = Object.assign({}, self.state.checked);
            next[x.id] = !next[x.id];
            self.setState({ checked: next });
          },
          rowStyle: 'display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 14px; border-radius: 16px; cursor: pointer; background: #FFFFFF; border: 1.5px solid ' + (on ? '#A9D3B1' : '#E7E1EE'),
          nameStyle: 'flex-grow: 1; font-size: 16px; font-weight: 700; ' + (on ? 'text-decoration: line-through; color: #5E5470' : 'color: #22193A'),
          qtyStyle: 'font-size: 15px; font-weight: 800; ' + (on ? 'color: #5E5470' : 'color: #C63D24')
        };
      })
    };
  }
}
</script>
</body>
</html>
