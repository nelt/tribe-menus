<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouveau plat (liserés doux)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',sans-serif;color:#22193A;background:#FFFFFF}
a{color:#C63D24}a:hover{color:#9E2E19}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Figtree', sans-serif; color: #22193A">

<div style="display: flex; flex-direction: column; gap: 16px; padding: 20px 20px 0">

<a href="Doux-Bibliotheque.dc.html" style="display: flex; align-items: center; gap: 4px; min-height: 44px; font-size: 15px; font-weight: 700; color: #22193A; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>Plats</a>

<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px">Nouveau plat</h1>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Nom du plat
<input type="text" value="Ratatouille" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 16px; border: 2px solid #22193A; background: #FFFFFF; font-size: 17px; font-weight: 700; color: #22193A">
</label>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; border-radius: 18px; border: 1.5px solid #F2D27A">
<span style="font-size: 15px; font-weight: 700">Pour combien de parts ?</span>
<div style="display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 14px; border: 1.5px solid #22193A">
<button aria-label="Une part de moins" style="width: 40px; height: 42px; border: none; border-radius: 11px; background: transparent; color: #22193A; font-size: 22px; font-weight: 700; cursor: pointer">−</button>
<span style="min-width: 24px; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">4</span>
<button aria-label="Une part de plus" style="width: 40px; height: 42px; border: none; border-radius: 11px; background: transparent; color: #C63D24; font-size: 22px; font-weight: 800; cursor: pointer">+</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px">Ingrédients</h2>

<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 52px 76px minmax(0, 1fr) 36px; gap: 6px; align-items: center; padding: 5px; border-radius: 16px; border: 1.5px solid #E7E1EE">
<span style="height: 38px; border-radius: 10px; border: 1.5px solid #E7E1EE; display: flex; align-items: center; justify-content: center; font-weight: 800">{{r.qty}}</span>
<span style="height: 38px; border-radius: 10px; border: 1.5px solid #E7E1EE; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">{{r.unit}}</span>
<span style="padding-left: 6px; font-weight: 700; font-size: 15px">{{r.name}}</span>
<button aria-label="Retirer l’ingrédient" style="width: 36px; height: 40px; border: none; border-radius: 10px; background: transparent; color: #6E6680; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-for>

<div style="display: flex; flex-direction: column; border-radius: 16px; border: 1.5px solid #E39A89; overflow: hidden">
<div style="display: grid; grid-template-columns: 52px 76px minmax(0, 1fr); gap: 6px; align-items: center; padding: 5px">
<span style="height: 38px; border-radius: 10px; border: 1.5px solid #E7E1EE; display: flex; align-items: center; justify-content: center; font-weight: 800">4</span>
<span style="height: 38px; border-radius: 10px; border: 1.5px solid #E7E1EE; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">pièce</span>
<label style="display: flex; align-items: center">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ingrédient</span>
<input type="text" value="tom" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 6px; border: none; outline: none; background: transparent; font-size: 15px; font-weight: 700; color: #22193A">
</label>
</div>
<div style="display: flex; flex-direction: column; border-top: 1.5px solid #F3C9BF">
<button style="display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 14px; border: none; background: #FFFFFF; text-align: left; font-size: 15px; color: #22193A; cursor: pointer"><span><strong style="color: #C63D24">tom</strong>ate</span><span style="margin-left: auto; font-size: 12px; font-weight: 600; color: #5E5470">pièce</span></button>
<button style="display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 14px; border: none; background: #FFFFFF; text-align: left; font-size: 15px; color: #22193A; cursor: pointer"><span><strong style="color: #C63D24">tom</strong>ate concassée</span><span style="margin-left: auto; font-size: 12px; font-weight: 600; color: #5E5470">g</span></button>
<button style="display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 14px; border: none; border-top: 1.5px solid #F0EAF4; background: #FFFFFF; text-align: left; font-size: 15px; font-weight: 700; color: #C63D24; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Créer « tom »</button>
</div>
</div>

<button style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 48px; border: 2px dashed #CFC6DE; border-radius: 16px; background: transparent; font-size: 15px; font-weight: 700; color: #22193A; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Ajouter un ingrédient</button>
</div>

</div>

<div style="position: absolute; left: 20px; right: 20px; bottom: 24px">
<a href="Doux-Bibliotheque.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; box-sizing: border-box; border-radius: 18px; background: #C63D24; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 800">Enregistrer le plat</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { qty: '3', unit: 'pièce', name: 'courgette' },
        { qty: '2', unit: 'pièce', name: 'aubergine' },
        { qty: '1', unit: 'pièce', name: 'poivron' }
      ]
    };
  }
}
</script>
</body>
</html>
