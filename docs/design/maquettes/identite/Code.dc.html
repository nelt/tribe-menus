<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion : code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',sans-serif;color:#22193A;background:#FFFFFF}
a{color:#C63D24}a:hover{color:#9E2E19}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 44px 20px 20px; background: #FFFFFF; font-family: 'Figtree', sans-serif; color: #22193A; display: flex; flex-direction: column; gap: 28px">
<header style="display: flex; flex-direction: column; align-items: center; gap: 10px"><div style="width: 170px; height: 170px; overflow: hidden; flex-shrink: 0"><div style="width: 320px; height: 320px; transform: scale(0.5312); transform-origin: 0 0"><dc-import name="Symbole" pastille="{{ true }}" hint-size="320px,320px"></dc-import></div></div><div style="width: 240px; height: 48px; overflow: hidden; flex-shrink: 0"><div style="width: 560px; height: 112px; transform: scale(0.4286); transform-origin: 0 0"><dc-import name="Wordmark" hint-size="560px,112px"></dc-import></div></div><span style="font-size: 15px; font-weight: 700; color: #5E5470">Les menus de la semaine, en tribu</span></header>
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end">
<form style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">Vérifiez vos e-mails</h2>
<span style="font-size: 14px; font-weight: 600; line-height: 1.4; color: #5E5470">Si <strong style="color: #22193A">alice@exemple.fr</strong> fait partie de la tribu, un code à 8 chiffres vient d’y être envoyé. <a href="Connexion.dc.html" style="font-weight: 800">Modifier</a></span>
</div>
<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Code de connexion</legend>
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{digits}}" as="d" hint-placeholder-count="8">
<input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" value="{{d.value}}" aria-label="{{d.label}}" style="{{d.style}}">
</sc-for>
</div>
<sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}">
<span role="alert" style="display: flex; align-items: flex-start; gap: 6px; font-size: 14px; font-weight: 700; line-height: 1.4; color: #C63D24"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg>{{errorText}}</span>
</sc-if>
</fieldset>
<sc-if value="{{canSubmit}}" hint-placeholder-val="{{ true }}">
<a href="#" style="display: flex; align-items: center; justify-content: center; height: 56px; box-sizing: border-box; border-radius: 18px; background: #C63D24; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 800; border: none; cursor: pointer">Se connecter</a>
<button type="button" style="min-height: 44px; border: none; background: transparent; color: #22193A; font-size: 14px; font-weight: 700; cursor: pointer">Je n’ai rien reçu : renvoyer un code</button>
</sc-if>
<sc-if value="{{mustResend}}" hint-placeholder-val="{{ false }}">
<button type="button" style="display: flex; align-items: center; justify-content: center; height: 56px; box-sizing: border-box; border-radius: 18px; background: #C63D24; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 800; border: none; cursor: pointer">Recevoir un nouveau code</button>
</sc-if>
</form>
</div>
<footer style="display: flex; justify-content: center; gap: 6px; font-size: 12px; font-weight: 600; color: #6E6680">Melting Tribe · <a href="https://github.com/nelt/tribe-menus" style="color: #6E6680">logiciel libre, code source</a></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844},"etat":{"editor":"enum","options":["saisie","code erroné","essais épuisés","code expiré"],"default":"saisie"}}'>
class Component extends DCLogic {
  renderVals() {
    var etat = this.props.etat ?? 'saisie';
    var wrong = etat === 'code erroné';
    var spent = etat === 'essais épuisés';
    var expired = etat === 'code expiré';
    var dead = spent || expired;
    var values = etat === 'saisie' ? ['4', '8', '2', '1', '9', '0', '', ''] : ['4', '8', '2', '1', '9', '0', '3', '7'];
    var focus = etat === 'saisie' ? 6 : -1;
    var digits = values.map(function (v, i) {
      var border = wrong ? '2px solid #C63D24' : (i === focus ? '2px solid #E39A89' : (dead ? '1.5px solid #E7E1EE' : (v ? '2px solid #22193A' : '1.5px solid #E7E1EE')));
      return {
        value: v,
        label: 'Chiffre ' + (i + 1) + ' sur 8',
        style: 'width: 100%; height: 56px; box-sizing: border-box; padding: 0; border-radius: 14px; border: ' + border + "; background: #FFFFFF; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; color: " + (dead ? '#6E6680' : '#22193A')
      };
    });
    var texts = {
      'code erroné': 'Code incorrect. Il vous reste 2 essais.',
      'essais épuisés': 'Trop d’essais : ce code n’est plus valable. Demandez-en un nouveau.',
      'code expiré': 'Ce code a expiré. Demandez-en un nouveau.'
    };
    return {
      digits: digits,
      hasError: etat !== 'saisie',
      errorText: texts[etat] || '',
      canSubmit: !dead,
      mustResend: dead
    };
  }
}
</script>
</body>
</html>
