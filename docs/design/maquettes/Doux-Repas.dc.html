<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Repas du mardi soir (liserés doux)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',sans-serif;color:#22193A;background:#FFFFFF}
a{color:#C63D24}a:hover{color:#9E2E19}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Figtree', sans-serif; color: #22193A">

<div style="display: flex; flex-direction: column; gap: 18px; padding: 20px 20px 100px">

<a href="Doux-Main.dc.html" style="display: flex; align-items: center; gap: 4px; min-height: 44px; font-size: 15px; font-weight: 700; color: #22193A; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>Planning</a>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border-radius: 24px; border: 1.5px solid #BDBAF0">
<span style="font-size: 14px; font-weight: 700; color: #3D3A8C">Mardi 6 octobre</span>
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; color: #3D3A8C">Soir</h1>
<span style="font-size: 15px; font-weight: 800; color: #C63D24">{{totalLabel}}</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px">Plats servis</h2>
<sc-for list="{{dishes}}" as="dish" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 20px; border: 1.5px solid #E7E1EE">
<span style="{{dish.avatarStyle}}">{{dish.initial}}</span>
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span style="font-weight: 700; font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{dish.name}}</span>
<span style="font-size: 12px; font-weight: 600; color: #5E5470">{{dish.refLabel}}</span>
</div>
<div style="display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 14px; border: 1.5px solid #22193A">
<button aria-label="Une part de moins" onClick="{{dish.dec}}" style="width: 36px; height: 42px; border: none; border-radius: 11px; background: transparent; color: #22193A; font-size: 22px; font-weight: 700; cursor: pointer">−</button>
<span style="min-width: 24px; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">{{dish.parts}}</span>
<button aria-label="Une part de plus" onClick="{{dish.inc}}" style="width: 36px; height: 42px; border: none; border-radius: 11px; background: transparent; color: #C63D24; font-size: 22px; font-weight: 800; cursor: pointer">+</button>
</div>
<button aria-label="Retirer ce plat du repas" onClick="{{dish.remove}}" style="width: 36px; height: 44px; border: none; border-radius: 12px; background: transparent; color: #6E6680; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-for>
<sc-if value="{{noDish}}" hint-placeholder-val="{{false}}">
<div style="padding: 18px; border-radius: 20px; border: 2px dashed #CFC6DE; text-align: center; font-weight: 600; color: #5E5470">Aucun plat pour ce repas</div>
</sc-if>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px">Ajouter un plat</h2>
<label style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; border-radius: 16px; border: 2px solid #22193A">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5470" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rechercher un plat</span>
<input type="search" placeholder="Nom du plat ou ingrédient" style="flex-grow: 1; border: none; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #22193A">
</label>
<span style="font-size: 13px; font-weight: 600; color: #5E5470">Les plats déjà servis dans ce repas ne sont pas proposés : réglez leurs parts ci-dessus.</span>
<sc-for list="{{suggestions}}" as="s" hint-placeholder-count="3">
<button onClick="{{s.add}}" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 10px; border: 1.5px solid #E7E1EE; border-radius: 16px; background: #FFFFFF; text-align: left; cursor: pointer; color: #22193A">
<span style="{{s.avatarStyle}}">{{s.initial}}</span>
<span style="flex-grow: 1; font-size: 15px; font-weight: 700">{{s.name}}</span>
<span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 999px; background: #C63D24; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
</button>
</sc-for>
</div>

</div>

<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 10px 16px 18px; background: #FFFFFF; border-top: 1.5px solid #E7E1EE; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<a href="Doux-Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; background: #C63D24; color: #FFFFFF; text-decoration: none; font-size: 12px; font-weight: 800"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>Planning</a>
<a href="Doux-Bibliotheque.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; color: #5E5470; text-decoration: none; font-size: 12px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5"></path><path d="M9 8h6"></path></svg>Plats</a>
<a href="Doux-ListesCourses.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; color: #5E5470; text-decoration: none; font-size: 12px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"></path><circle cx="10" cy="20" r="1.3"></circle><circle cx="17" cy="20" r="1.3"></circle></svg>Courses</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844},"tailleTribu":{"editor":"int","default":4,"min":1,"max":12}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      served: [
        { id: 'chili', name: 'Chili con carne', color: '#C2502E', parts: 3, ref: 4 },
        { id: 'vege', name: 'Chili végétarien', color: '#3F7F25', parts: 1, ref: 4 }
      ]
    };
  }
  renderVals() {
    var tint = function (h) { var n = parseInt(h.slice(1), 16), f = function (c) { return Math.round(c + (255 - c) * 0.6); }; return 'rgb(' + f(n >> 16) + ', ' + f((n >> 8) & 255) + ', ' + f(n & 255) + ')'; };
    var self = this;
    var tribeSize = this.props.tailleTribu ?? 4;
    var catalog = [
      { id: 'chili', name: 'Chili con carne', color: '#C2502E', ref: 4 },
      { id: 'vege', name: 'Chili végétarien', color: '#3F7F25', ref: 4 },
      { id: 'ratatouille', name: 'Ratatouille', color: '#B36A0B', ref: 4 },
      { id: 'gratin', name: 'Gratin dauphinois', color: '#B0306A', ref: 6 },
      { id: 'pesto', name: 'Pâtes pesto', color: '#2E8A6E', ref: 4 }
    ];
    var avatar = function (c) {
      return 'flex-shrink: 0; width: 40px; height: 40px; box-sizing: border-box; border-radius: 12px; border: 1.5px solid ' + tint(c) + '; display: flex; align-items: center; justify-content: center; font-family: Bricolage Grotesque, sans-serif; font-weight: 800; font-size: 18px; color: ' + c;
    };
    var served = this.state.served;
    var update = function (id, fn) {
      self.setState({ served: self.state.served.map(function (x) { return x.id === id ? Object.assign({}, x, { parts: fn(x.parts) }) : x; }) });
    };
    var total = served.reduce(function (a, x) { return a + x.parts; }, 0);
    return {
      totalLabel: total + (total > 1 ? ' parts' : ' part'),
      noDish: served.length === 0,
      dishes: served.map(function (x) {
        return {
          name: x.name, parts: x.parts, initial: x.name.charAt(0), avatarStyle: avatar(x.color), refLabel: 'Défini pour ' + x.ref + ' parts',
          inc: function () { update(x.id, function (p) { return p + 1; }); },
          dec: function () { update(x.id, function (p) { return Math.max(1, p - 1); }); },
          remove: function () { self.setState({ served: self.state.served.filter(function (y) { return y.id !== x.id; }) }); }
        };
      }),
      suggestions: catalog.filter(function (c) { return !served.some(function (x) { return x.id === c.id; }); }).map(function (c) {
        return {
          name: c.name, initial: c.name.charAt(0), avatarStyle: avatar(c.color),
          add: function () { self.setState({ served: self.state.served.concat([{ id: c.id, name: c.name, color: c.color, parts: tribeSize, ref: c.ref }]) }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
